<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA3 Fractals</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0b0d15;
        background-image:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(72, 49, 212, 0.12) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 50%,
            rgba(212, 49, 140, 0.1) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 50% 100%,
            rgba(49, 212, 180, 0.06) 0%,
            transparent 50%
          );
        padding: 1.5rem;
        position: relative;
      }

      /* subtle animated grain overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      .window {
        position: relative;
        z-index: 1;
        max-width: 720px;
        width: 100%;
        background: rgba(18, 22, 36, 0.75);
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        border-radius: 2.5rem;
        padding: 2.8rem 3rem 3.2rem;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.04),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition:
          transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.5s ease;
      }

      .window:hover {
        transform: translateY(-4px) scale(1.003);
        box-shadow:
          0 45px 100px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(255, 255, 255, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .title-bar {
        text-align: center;
        margin-bottom: 2.8rem;
        position: relative;
      }

      .title-bar h1 {
        font-size: 3.8rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(
          135deg,
          #f0eaff 0%,
          #b7a9ff 45%,
          #ff8cdd 75%,
          #ffb56b 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 60px rgba(140, 90, 255, 0.2);
        display: inline-block;
        position: relative;
        line-height: 1.1;
      }

      .title-bar::after {
        content: "";
        display: block;
        width: 120px;
        height: 3px;
        margin: 1rem auto 0;
        background: linear-gradient(
          90deg,
          transparent,
          #7a5cff,
          #ff6bcb,
          transparent
        );
        border-radius: 4px;
        opacity: 0.6;
        filter: blur(0.5px);
      }

      .menu {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .menu h2 {
        margin: 0;
        font-weight: 500;
        font-size: 1.2rem;
        letter-spacing: 0.01em;
        border-radius: 1.2rem;
        transition: all 0.25s ease;
        position: relative;
      }

      .menu h2 a {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.1rem 1.8rem;
        text-decoration: none;
        color: rgba(255, 255, 255, 0.78);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 1.2rem;
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        font-weight: 500;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      /* subtle background shimmer on each item */
      .menu h2 a::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.02),
          transparent 60%
        );
        pointer-events: none;
        border-radius: 1.2rem;
      }

      /* project "bullet" icon */
      .menu h2 a::after {
        content: "*";
        margin-left: auto;
        font-size: 1.3rem;
        color: rgba(255, 255, 255, 0.15);
        transition: all 0.3s ease;
        font-weight: 300;
      }

      .menu h2 a:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        transform: translateX(6px) scale(1.01);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }

      .menu h2 a:hover::after {
        color: rgba(180, 130, 255, 0.7);
        transform: translateX(4px);
      }

      /* individual accent colors per project */
      .menu h2:nth-child(1) a {
        border-left: 3px solid #7a5cff;
      }
      .menu h2:nth-child(2) a {
        border-left: 3px solid #ff6bcb;
      }
      .menu h2:nth-child(3) a {
        border-left: 3px solid #4dd4c0;
      }
      .menu h2:nth-child(4) a {
        border-left: 3px solid #ffb56b;
      }

      .menu h2:nth-child(1) a:hover {
        border-left-color: #9a82ff;
        box-shadow: 0 8px 32px rgba(122, 92, 255, 0.15);
      }
      .menu h2:nth-child(2) a:hover {
        border-left-color: #ff8cdd;
        box-shadow: 0 8px 32px rgba(255, 107, 203, 0.15);
      }
      .menu h2:nth-child(3) a:hover {
        border-left-color: #6ee6d4;
        box-shadow: 0 8px 32px rgba(77, 212, 192, 0.15);
      }
      .menu h2:nth-child(4) a:hover {
        border-left-color: #ffc98a;
        box-shadow: 0 8px 32px rgba(255, 181, 107, 0.15);
      }

      /* small project label / tag */
      .menu h2 a .tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.2rem 0.7rem;
        border-radius: 100px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.3s ease;
        margin-left: 0.2rem;
        font-weight: 400;
      }

      .menu h2 a:hover .tag {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.5);
        border-color: rgba(255, 255, 255, 0.08);
      }

      @media (max-width: 600px) {
        .window {
          padding: 1.8rem 1.5rem 2.2rem;
          border-radius: 1.8rem;
        }

        .title-bar h1 {
          font-size: 2.8rem;
        }

        .title-bar::after {
          width: 80px;
        }

        .menu h2 a {
          padding: 0.9rem 1.3rem;
          font-size: 1rem;
          border-radius: 1rem;
        }

        .menu h2 a .tag {
          font-size: 0.6rem;
          padding: 0.1rem 0.5rem;
        }

        .menu h2 a::after {
          font-size: 1rem;
        }
      }

      @media (max-width: 400px) {
        .title-bar h1 {
          font-size: 2.2rem;
        }

        .window {
          padding: 1.4rem 1rem 1.8rem;
        }

        .menu h2 a {
          padding: 0.7rem 1rem;
          font-size: 0.9rem;
          gap: 0.5rem;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }

      .window {
        animation: float 6s ease-in-out infinite;
      }

      .window:hover {
        animation-play-state: paused;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="title-bar">
        <h1>AA3 Fractals</h1>
      </div>
      <div class="menu">
        <h2><a href="mandl.html">Mandelbrot</a></h2>
        <h2><a href="julia.html">Julia</a></h2>
        <h2><a href="newton.html">Newton</a></h2>
        <h2><a href="../../index.html">Menu</a></h2>
      </div>
    </div>
  </body>
</html>
